<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Django</title>
    <!-- Aquí importamos Bootstrap 5 directamente desde internet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_productos' %}">💻 Sistema de Inventario</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listar_marcas' %}">Marcas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listar_productos' %}">Productos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Dinámico: Aquí adentro se inyectarán tus otras páginas -->
    <div class="container bg-white p-4 rounded shadow-sm">
        {% block contenido %}
        {% endblock %}
    </div>

</body>
</html>
